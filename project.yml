name: Monica
options:
  bundleIdPrefix: com.monicahq
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Monica:
    type: application
    platform: iOS
    sources:
      - Monica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monicahq.ios
        PRODUCT_NAME: Monica
        INFOPLIST_KEY_CFBundleDisplayName: Monica
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        # The return address of sign-in (com.monicahq.ios), merged with the generated keys.
        INFOPLIST_FILE: Config/Info.plist
      configs:
        # Debug only: plain http, for a Monica running on the developer's machine.
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
  MonicaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MonicaTests
    dependencies:
      - target: Monica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monicahq.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
  MonicaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MonicaUITests
    dependencies:
      - target: Monica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monicahq.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Monica
schemes:
  Monica:
    build:
      targets:
        Monica: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Monica
      targets:
        - MonicaTests
        - MonicaUITests
    archive:
      config: Release
