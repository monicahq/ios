name: Start the simulator
description: >
  Start booting the iPhone 17 simulator of the newest iOS runtime in the background and export
  its id as SIMULATOR_ID. Wait for it with wait-for-simulator before the tests.

runs:
  using: composite
  steps:
    # CoreSimulator sometimes starts after the job, and xcodebuild then sees no simulator at all.
    # The first boot of a new simulator runs iOS data migration for 1 to 2 minutes, and much
    # longer right after a build. Booting in the background from the start of the job overlaps it
    # with the build instead. The id makes xcodebuild test on that very simulator.
    - name: Start the simulator
      shell: bash
      run: |
        find_simulator() {
          xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $v
              | .value[] | select(.name == "iPhone 17") | {v: $v, udid}]
            | sort_by(.v) | last | .udid // empty'
        }
        for attempt in $(seq 1 24); do
          id=$(find_simulator)
          if [ -n "$id" ]; then break; fi
          echo "Simulators not ready yet (attempt $attempt)"; sleep 5
        done
        if [ -z "$id" ]; then xcrun simctl list devices available; exit 1; fi
        nohup xcrun simctl boot "$id" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 < /dev/null &
        echo $! > "$RUNNER_TEMP/simulator-boot.pid"
        echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
