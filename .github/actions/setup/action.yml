name: Set up build environment
description: Install the tools pinned in mise.toml and generate the Xcode project

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5

    - name: Generate the Xcode project
      shell: bash
      run: xcodegen generate

    # CoreSimulator sometimes starts after the job, and xcodebuild then sees no simulator at all.
    - name: Wait for the simulators
      shell: bash
      run: |
        for attempt in $(seq 1 24); do
          if xcrun simctl list devices available | grep -q "iPhone 17 ("; then exit 0; fi
          echo "Simulators not ready yet (attempt $attempt)"; sleep 5
        done
        xcrun simctl list devices available
        exit 1
