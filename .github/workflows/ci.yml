name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # SwiftFormat and SwiftLint share one job: each takes seconds, and every job holds one of the
  # few macOS runners the account may use at once.
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check formatting (SwiftFormat)
        run: swiftformat --lint .
      - name: SwiftLint
        if: success() || failure()
        run: swiftlint --strict --reporter github-actions-logging

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Boots in the background during the build: booting after the build is twice as slow.
      - uses: ./.github/actions/boot-simulator
      - uses: ./.github/actions/setup
      # arm64 only, the runner's.
      - name: Build for testing
        run: >
          xcodebuild build-for-testing -project Monica.xcodeproj -scheme Monica
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64
          -enableCodeCoverage YES COMPILER_INDEX_STORE_ENABLE=NO
          -derivedDataPath build/derived-data
      - uses: ./.github/actions/wait-for-simulator
      - name: Unit tests
        run: >
          xcodebuild test-without-building -project Monica.xcodeproj -scheme Monica
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:MonicaTests
          -derivedDataPath build/derived-data
          -resultBundlePath build/unit-tests.xcresult
      - name: Coverage gate
        run: scripts/check-coverage.sh build/unit-tests.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/unit-tests.xcresult
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The unit tests job already builds the Debug app for the simulator.
      - name: Build release for devices (unsigned)
        run: >
          xcodebuild build -project Monica.xcodeproj -scheme Monica -configuration Release
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO

