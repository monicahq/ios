name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check formatting (SwiftFormat)
        run: swiftformat --lint .

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          boot-simulator: true
      - name: Unit tests
        run: >
          xcodebuild test -project Monica.xcodeproj -scheme Monica
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:MonicaTests
          -resultBundlePath build/unit-tests.xcresult
      - name: Coverage gate
        run: scripts/check-coverage.sh build/unit-tests.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/unit-tests.xcresult
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build debug for the simulator
        run: >
          xcodebuild build -project Monica.xcodeproj -scheme Monica -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData
      - name: Build release for devices (unsigned)
        run: >
          xcodebuild build -project Monica.xcodeproj -scheme Monica -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Upload debug app
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Monica.app

  ui-tests:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          boot-simulator: true
      # A test that hangs (the app failing to launch on the runner) is stopped after 3 minutes
      # instead of blocking the job, and a failed test runs once more: a runner hiccup passes on
      # the second try, a real bug fails twice.
      - name: UI tests on the simulator
        run: >
          xcodebuild test -project Monica.xcodeproj -scheme Monica
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:MonicaUITests
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 180
          -maximum-test-execution-time-allowance 300
          -retry-tests-on-failure -test-iterations 2 -test-repetition-relaunch-enabled YES
          -resultBundlePath build/ui-tests.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: build/ui-tests.xcresult
          if-no-files-found: ignore
