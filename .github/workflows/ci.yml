name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # SwiftFormat and SwiftLint share one job: each takes seconds, and every job holds one of the
  # few macOS runners the account may use at once.
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check formatting (SwiftFormat)
        run: swiftformat --lint .
      - name: SwiftLint
        if: success() || failure()
        run: swiftlint --strict --reporter github-actions-logging

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Built before the simulator boots: a booting simulator keeps the runner's few cores busy
      # for minutes, and the build then takes several times longer. arm64 only, the runner's.
      - name: Build for testing
        run: >
          xcodebuild build-for-testing -project Monica.xcodeproj -scheme Monica
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64
          -enableCodeCoverage YES COMPILER_INDEX_STORE_ENABLE=NO
          -derivedDataPath build/derived-data
      - uses: ./.github/actions/boot-simulator
      - name: Unit tests
        run: >
          xcodebuild test-without-building -project Monica.xcodeproj -scheme Monica
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:MonicaTests
          -derivedDataPath build/derived-data
          -resultBundlePath build/unit-tests.xcresult
      - name: Coverage gate
        run: scripts/check-coverage.sh build/unit-tests.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/unit-tests.xcresult
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The test jobs already build the Debug app for the simulator.
      - name: Build release for devices (unsigned)
        run: >
          xcodebuild build -project Monica.xcodeproj -scheme Monica -configuration Release
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO

  ui-tests:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Built before the simulator boots, as in the unit tests job.
      - name: Build for testing
        run: >
          xcodebuild build-for-testing -project Monica.xcodeproj -scheme Monica
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64
          -enableCodeCoverage NO COMPILER_INDEX_STORE_ENABLE=NO
          -derivedDataPath build/derived-data
      - uses: ./.github/actions/boot-simulator
      # A test that hangs (the app failing to launch on the runner) is stopped after 3 minutes
      # instead of blocking the job, and a failed test runs once more: a runner hiccup passes on
      # the second try, a real bug fails twice.
      - name: UI tests on the simulator
        run: >
          xcodebuild test-without-building -project Monica.xcodeproj -scheme Monica
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:MonicaUITests
          -derivedDataPath build/derived-data
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 180
          -maximum-test-execution-time-allowance 300
          -retry-tests-on-failure -test-iterations 2 -test-repetition-relaunch-enabled YES
          -resultBundlePath build/ui-tests.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: build/ui-tests.xcresult
          if-no-files-found: ignore
